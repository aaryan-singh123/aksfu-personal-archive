<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKSFU — Personal Archive</title>
<style>
  :root{
    --bg: #EDEFE8;
    --surface: #FFFFFF;
    --surface-2: #E3E6DC;
    --ink: #16231C;
    --ink-soft: #47564C;
    --muted: #7C8A7E;
    --line: #D3D8CB;
    --accent: #2F5233;
    --accent-hov: #24401F;
    --accent-soft: #DCE6D5;
    --rust: #A9502C;
    --rust-soft: #F3DFD3;
    --gold: #B5872A;
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(22,35,28,0.06), 0 1px 1px rgba(22,35,28,0.04);
    --shadow-md: 0 8px 24px rgba(22,35,28,0.10);
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- Utility ---------- */
  button{font-family:inherit; cursor:pointer;}
  input, textarea{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ---------- Login Screen ---------- */
  #loginScreen{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 20% 20%, rgba(47,82,51,0.06), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(181,135,42,0.06), transparent 40%),
      var(--bg);
  }
  .login-card{
    width:100%; max-width:380px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:40px 32px 32px;
    box-shadow:var(--shadow-md);
    text-align:center;
    animation:riseIn .5s ease both;
  }
  @keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .brand-mark{
    width:56px; height:56px; margin:0 auto 18px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:.5px;
  }
  .login-card h1{
    font-family:var(--font-display); font-size:28px; margin:0 0 4px; letter-spacing:.5px;
  }
  .login-card p.tag{
    color:var(--muted); font-size:13px; margin:0 0 28px; letter-spacing:.4px; text-transform:uppercase;
  }
  .field{ text-align:left; margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; letter-spacing:.3px; }
  .field input, .field textarea{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:#FBFCF9; font-size:14.5px; color:var(--ink); transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field textarea:focus{
    border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 20px; border-radius:var(--radius-sm); border:1px solid transparent;
    font-size:14px; font-weight:600; letter-spacing:.2px; transition:transform .08s, background .15s, box-shadow .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{ background:var(--accent); color:#fff; width:100%; padding:12px; }
  .btn-primary:hover{ background:var(--accent-hov); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-icon{ padding:8px; border-radius:var(--radius-sm); background:transparent; border:1px solid var(--line); color:var(--ink-soft); }
  .btn-icon:hover{ background:var(--surface-2); color:var(--ink); }
  .btn-icon.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-danger{ background:transparent; color:var(--rust); border-color:var(--rust-soft); }
  .btn-danger:hover{ background:var(--rust-soft); }
  .error-msg{ color:var(--rust); font-size:13px; margin-top:10px; min-height:18px; }

  /* ---------- Top bar ---------- */
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(237,239,232,0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 22px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .logo{
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .logo .mark{
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:15px;
  }
  .logo .word{ font-family:var(--font-display); font-size:20px; letter-spacing:.5px; }
  .logo .sub{ display:block; font-size:10px; color:var(--muted); letter-spacing:.6px; text-transform:uppercase; margin-top:-2px;}

  .search-wrap{ flex:1; min-width:180px; position:relative; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
  .search-wrap input{
    width:100%; padding:10px 14px 10px 38px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); font-size:14px; color:var(--ink);
  }
  .search-wrap input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none; }

  .topbar-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }

  /* ---------- Toolbar (filters + view toggle) ---------- */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 22px 4px; flex-wrap:wrap;
  }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
    font-size:13px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; gap:6px;
  }
  .chip .count{ font-family:var(--font-mono); font-size:11px; opacity:.7; }
  .chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .view-toggle{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:3px; }
  .view-toggle .btn-icon{ border:none; padding:6px 9px; }

  /* ---------- Main content ---------- */
  main{ flex:1; padding:18px 22px 60px; }

  .empty-state{
    text-align:center; padding:80px 20px; color:var(--muted);
  }
  .empty-state svg{ margin-bottom:14px; opacity:.5; }
  .empty-state h3{ font-family:var(--font-display); font-size:20px; color:var(--ink); margin:0 0 6px; }

  /* Grid view */
  .file-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:16px;
  }
  .file-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm);
    transition:box-shadow .15s, transform .15s; position:relative; animation:cardIn .35s ease both;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .file-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .file-icon{
    width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .file-icon.Image{ background:#DCE6D5; color:var(--accent); }
  .file-icon.PDF{ background:var(--rust-soft); color:var(--rust); }
  .file-icon.Doc{ background:#DCE8EE; color:#2A5C70; }
  .file-icon.Other{ background:#EDE4D0; color:var(--gold); }
  .cat-tag{
    font-size:10px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.5px;
    padding:3px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft);
  }
  .file-name{
    font-size:15px; font-weight:600; color:var(--ink); line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .file-desc{
    font-size:12.5px; color:var(--muted); line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    min-height:17px;
  }
  .file-meta{
    display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-family:var(--font-mono);
    border-top:1px dashed var(--line); padding-top:8px;
  }
  .card-actions{ display:flex; gap:6px; margin-top:2px; }
  .card-actions .btn-icon{ flex:1; }

  /* List view */
  .file-list{ display:flex; flex-direction:column; gap:8px; }
  .file-row{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:10px 14px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm);
    animation:cardIn .3s ease both;
  }
  .file-row .file-icon{ width:36px; height:36px; }
  .file-row .row-main{ flex:1; min-width:0; }
  .file-row .file-name{ -webkit-line-clamp:1; font-size:14px; }
  .file-row .file-desc{ -webkit-line-clamp:1; min-height:0; }
  .file-row .file-meta{ border:none; padding:0; flex-shrink:0; flex-direction:column; align-items:flex-end; gap:2px; }
  .file-row .card-actions{ margin:0; flex-shrink:0; }
  .file-row .card-actions .btn-icon{ flex:none; }
  @media (max-width:640px){
    .file-row .file-meta{ display:none; }
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(22,35,28,0.45); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
    animation:fadeIn .15s ease both;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{
    background:var(--surface); border-radius:var(--radius-lg); max-width:440px; width:100%;
    padding:26px; box-shadow:var(--shadow-md); animation:riseIn .25s ease both; max-height:90vh; overflow-y:auto;
  }
  .modal h2{ font-family:var(--font-display); font-size:21px; margin:0 0 18px; }
  .dropzone{
    border:2px dashed var(--line); border-radius:var(--radius-md); padding:26px 16px; text-align:center;
    color:var(--muted); font-size:13px; cursor:pointer; transition:border-color .15s, background .15s; margin-bottom:16px;
  }
  .dropzone:hover, .dropzone.drag{ border-color:var(--accent); background:var(--accent-soft); }
  .dropzone svg{ margin-bottom:8px; }
  .dropzone .fname{ color:var(--ink); font-weight:600; margin-top:4px; word-break:break-all; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:13.5px;
    box-shadow:var(--shadow-md); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:200;
    display:flex; align-items:center; gap:8px; max-width:90vw;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Detail / View screen ---------- */
  #detailScreen{ flex:1; display:none; flex-direction:column; }
  .detail-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 22px; border-bottom:1px solid var(--line); background:var(--surface);
    flex-wrap:wrap;
  }
  .detail-bar .left{ display:flex; align-items:center; gap:12px; min-width:0; }
  .detail-bar h2{ font-family:var(--font-display); font-size:17px; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .detail-bar .right{ display:flex; gap:8px; flex-shrink:0; }
  .detail-body{ flex:1; padding:22px; display:flex; align-items:center; justify-content:center; }
  .detail-frame{
    width:100%; max-width:900px; height:72vh; border:1px solid var(--line); border-radius:var(--radius-md);
    background:var(--surface); box-shadow:var(--shadow-sm); overflow:hidden;
  }
  .detail-frame iframe{ width:100%; height:100%; border:none; }
  .detail-fallback{ text-align:center; color:var(--muted); padding:60px 20px; }
  .detail-fallback svg{ margin-bottom:14px; opacity:.5; }

  /* Spinner */
  .spin{ width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
  .spin.dark{ border:2px solid var(--line); border-top-color:var(--accent); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:560px){
    header.topbar{ padding:12px 14px; }
    .toolbar{ padding:12px 14px 0; }
    main{ padding:14px 14px 50px; }
    .logo .word{ font-size:17px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="brand-mark">A</div>
      <h1>AKSFU</h1>
      <p class="tag">Your Personal Archive</p>
      <form id="loginForm">
        <div class="field">
          <label for="pwInput">Password</label>
          <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span id="loginBtnLabel">Unlock</span>
        </button>
        <div class="error-msg" id="loginError"></div>
      </form>
    </div>
  </div>

  <!-- MAIN APP (hidden until login) -->
  <div id="mainScreen" style="display:none; flex-direction:column; flex:1;">
    <header class="topbar">
      <div class="logo">
        <div class="mark">A</div>
        <div>
          <span class="word">AKSFU</span>
          <span class="sub">Personal Archive</span>
        </div>
      </div>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search your files...">
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="uploadBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
          Upload
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="filters" id="filterChips">
        <button class="chip active" data-cat="All">All <span class="count" id="cnt-All">0</span></button>
        <button class="chip" data-cat="Image">Images <span class="count" id="cnt-Image">0</span></button>
        <button class="chip" data-cat="Doc">Docs <span class="count" id="cnt-Doc">0</span></button>
        <button class="chip" data-cat="PDF">PDF <span class="count" id="cnt-PDF">0</span></button>
        <button class="chip" data-cat="Other">Other <span class="count" id="cnt-Other">0</span></button>
      </div>
      <div class="view-toggle">
        <button class="btn-icon active" id="gridViewBtn" aria-label="Grid view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button class="btn-icon" id="listViewBtn" aria-label="List view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
        </button>
      </div>
    </div>

    <main>
      <div id="loadingState" style="text-align:center; padding:60px;"><div class="spin dark" style="margin:0 auto;"></div></div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <h3 id="emptyTitle">No files yet</h3>
        <p>Tap Upload to add your first file.</p>
      </div>
      <div id="fileGrid" class="file-grid"></div>
    </main>
  </div>

  <!-- DETAIL / VIEW SCREEN -->
  <div id="detailScreen">
    <div class="detail-bar">
      <div class="left">
        <button class="btn-icon" id="backBtn" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 id="detailTitle">File</h2>
      </div>
      <div class="right">
        <button class="btn btn-ghost" id="detailDownloadBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Download
        </button>
        <button class="btn btn-primary" id="detailShareBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17"/><path d="M15.4 7 8.6 10.5"/></svg>
          Share
        </button>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-frame" id="detailFrame"></div>
    </div>
  </div>

</div>

<!-- UPLOAD MODAL -->
<div class="overlay" id="uploadOverlay" style="display:none;">
  <div class="modal">
    <h2>Upload New File</h2>
    <input type="file" id="fileInput" class="visually-hidden">
    <div class="dropzone" id="dropzone">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
      <div id="dropzoneText">Click karo ya file yaha drag karo</div>
      <div class="fname" id="chosenFileName"></div>
    </div>
    <div class="field">
      <label for="titleInput">Title</label>
      <input type="text" id="titleInput" placeholder="File select karne par auto-fill ho jayega">
    </div>
    <div class="field">
      <label for="descInput">Description <span style="font-weight:400; color:var(--muted);">(optional)</span></label>
      <textarea id="descInput" rows="2" placeholder="Add a note if you'd like..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelUploadBtn">Cancel</button>
      <button class="btn btn-primary" id="submitUploadBtn"><span id="uploadBtnLabel">Save</span></button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="overlay" id="editOverlay" style="display:none;">
  <div class="modal">
    <h2>Edit Details</h2>
    <div class="field">
      <label for="editTitleInput">Title</label>
      <input type="text" id="editTitleInput">
    </div>
    <div class="field">
      <label for="editDescInput">Description</label>
      <textarea id="editDescInput" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelEditBtn">Cancel</button>
      <button class="btn btn-primary" id="saveEditBtn"><span id="editBtnLabel">Save Changes</span></button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="overlay" id="deleteOverlay" style="display:none;">
  <div class="modal" style="max-width:360px; text-align:center;">
    <h2 style="margin-bottom:8px;">File Delete Karein?</h2>
    <p style="color:var(--muted); font-size:14px; margin-bottom:20px;" id="deleteFileName"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelDeleteBtn">Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteBtn" style="flex:1; border:1px solid var(--rust);">
        <span id="deleteBtnLabel">Delete</span>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';

  // ============ CONFIG ============
  const API_URL = 'https://script.google.com/macros/s/AKfycbx_P8Mte5wurNEKXQ9vrNxdq95UXvQFb0upDxAE2fVMZRdReZp1hWB7ME94jQc17cYI/exec';

  // ============ STATE ============
  let files = [];
  let activeCategory = 'All';
  let searchQuery = '';
  let viewMode = 'grid'; // 'grid' | 'list'
  let currentDetailFile = null;
  let selectedFileObj = null; // File chosen in upload modal

  // ============ DOM refs ============
  const $ = (id) => document.getElementById(id);
  const loginScreen = $('loginScreen');
  const mainScreen = $('mainScreen');
  const detailScreen = $('detailScreen');
  const toast = $('toast');

  // ============ Helpers ============
  function showToast(msg, isError){
    toast.textContent = msg;
    toast.style.background = isError ? '#A9502C' : '#16231C';
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toast.classList.remove('show'), 3200);
  }

  async function apiCall(action, payload){
    payload = payload || {};
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
      body: JSON.stringify(Object.assign({ action: action }, payload))
    });
    if(!res.ok) throw new Error('Network error: ' + res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }

  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = () => reject(new Error('File read failed'));
      reader.readAsDataURL(file);
    });
  }

  function formatDate(iso){
    try{
      const d = new Date(iso);
      return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    }catch(e){ return ''; }
  }

  function iconSvg(cat){
    const icons = {
      Image: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
      PDF: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
      Doc: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>',
      Other: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
    };
    return icons[cat] || icons.Other;
  }

  // ============ LOGIN ============
  $('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const pw = $('pwInput').value;
    const btn = $('loginBtn'); const label = $('loginBtnLabel');
    $('loginError').textContent = '';
    label.innerHTML = '<span class="spin"></span>';
    btn.disabled = true;
    try{
      const data = await apiCall('login', { password: pw });
      if(data.success){
        loginScreen.style.display = 'none';
        mainScreen.style.display = 'flex';
        loadFiles();
      } else {
        $('loginError').textContent = 'Incorrect password. Please try again.';
      }
    }catch(err){
      $('loginError').textContent = 'Connection error: ' + err.message;
    }finally{
      label.textContent = 'Unlock';
      btn.disabled = false;
    }
  });

  // ============ LOAD FILES ============
  async function loadFiles(){
    $('loadingState').style.display = 'block';
    $('fileGrid').style.display = 'none';
    $('emptyState').style.display = 'none';
    try{
      const data = await apiCall('list', {});
      files = (data.files || []).sort((a,b) => new Date(b.UploadDate) - new Date(a.UploadDate));
      renderCounts();
      renderFiles();
    }catch(err){
      showToast('Could not load files: ' + err.message, true);
    }finally{
      $('loadingState').style.display = 'none';
    }
  }

  function renderCounts(){
    const cats = { All: files.length, Image:0, Doc:0, PDF:0, Other:0 };
    files.forEach(f => { if(cats[f.Category] !== undefined) cats[f.Category]++; });
    Object.keys(cats).forEach(c => { const el = $('cnt-'+c); if(el) el.textContent = cats[c]; });
  }

  function getFiltered(){
    return files.filter(f => {
      const matchesCat = activeCategory === 'All' || f.Category === activeCategory;
      const q = searchQuery.toLowerCase();
      const matchesSearch = !q || (f.FileName||'').toLowerCase().includes(q) || (f.Description||'').toLowerCase().includes(q);
      return matchesCat && matchesSearch;
    });
  }

  function renderFiles(){
    const list = getFiltered();
    const grid = $('fileGrid');
    grid.className = viewMode === 'grid' ? 'file-grid' : 'file-list';
    grid.innerHTML = '';

    if(list.length === 0){
      grid.style.display = 'none';
      $('emptyState').style.display = 'block';
      $('emptyTitle').textContent = files.length === 0 ? 'No files yet' : 'Nothing found';
      return;
    }
    $('emptyState').style.display = 'none';
    grid.style.display = viewMode === 'grid' ? 'grid' : 'flex';

    list.forEach(f => {
      const el = document.createElement('div');
      el.className = viewMode === 'grid' ? 'file-card' : 'file-row';
      el.innerHTML = viewMode === 'grid' ? gridCardHTML(f) : listRowHTML(f);
      grid.appendChild(el);
      bindCardActions(el, f);
    });
  }

  function gridCardHTML(f){
    return `
      <div class="card-top">
        <div class="file-icon ${f.Category}">${iconSvg(f.Category)}</div>
        <span class="cat-tag">${f.Category}</span>
      </div>
      <div class="file-name">${escapeHtml(f.FileName)}</div>
      <div class="file-desc">${escapeHtml(f.Description || '')}</div>
      <div class="file-meta"><span>${formatDate(f.UploadDate)}</span><span>${f.FileSize||''}</span></div>
      <div class="card-actions">
        <button class="btn-icon" data-act="view" aria-label="View">${eyeSvg()}</button>
        <button class="btn-icon" data-act="download" aria-label="Download">${downloadSvg()}</button>
        <button class="btn-icon" data-act="share" aria-label="Share">${shareSvg()}</button>
        <button class="btn-icon" data-act="edit" aria-label="Edit">${editSvg()}</button>
        <button class="btn-icon" data-act="delete" aria-label="Delete" style="color:var(--rust);">${trashSvg()}</button>
      </div>
    `;
  }

  function listRowHTML(f){
    return `
      <div class="file-icon ${f.Category}">${iconSvg(f.Category)}</div>
      <div class="row-main">
        <div class="file-name">${escapeHtml(f.FileName)}</div>
        <div class="file-desc">${escapeHtml(f.Description || '')}</div>
      </div>
      <div class="file-meta"><span>${formatDate(f.UploadDate)}</span><span>${f.FileSize||''}</span></div>
      <div class="card-actions">
        <button class="btn-icon" data-act="view" aria-label="View">${eyeSvg()}</button>
        <button class="btn-icon" data-act="download" aria-label="Download">${downloadSvg()}</button>
        <button class="btn-icon" data-act="share" aria-label="Share">${shareSvg()}</button>
        <button class="btn-icon" data-act="edit" aria-label="Edit">${editSvg()}</button>
        <button class="btn-icon" data-act="delete" aria-label="Delete" style="color:var(--rust);">${trashSvg()}</button>
      </div>
    `;
  }

  function eyeSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'; }
  function downloadSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>'; }
  function shareSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17"/><path d="M15.4 7 8.6 10.5"/></svg>'; }
  function editSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>'; }
  function trashSvg(){ return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>'; }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function bindCardActions(el, f){
    el.querySelector('[data-act="view"]').addEventListener('click', () => openDetail(f));
    el.querySelector('[data-act="download"]').addEventListener('click', () => downloadFile(f));
    el.querySelector('[data-act="share"]').addEventListener('click', () => shareFileAction(f));
    el.querySelector('[data-act="edit"]').addEventListener('click', () => openEdit(f));
    el.querySelector('[data-act="delete"]').addEventListener('click', () => openDeleteConfirm(f));
  }

  // ============ FILTER / SEARCH / VIEW TOGGLE ============
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCategory = chip.dataset.cat;
      renderFiles();
    });
  });

  $('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderFiles();
  });

  $('gridViewBtn').addEventListener('click', () => {
    viewMode = 'grid';
    $('gridViewBtn').classList.add('active');
    $('listViewBtn').classList.remove('active');
    renderFiles();
  });
  $('listViewBtn').addEventListener('click', () => {
    viewMode = 'list';
    $('listViewBtn').classList.add('active');
    $('gridViewBtn').classList.remove('active');
    renderFiles();
  });

  // ============ UPLOAD MODAL ============
  $('uploadBtn').addEventListener('click', () => {
    selectedFileObj = null;
    $('fileInput').value = '';
    $('titleInput').value = '';
    $('descInput').value = '';
    $('chosenFileName').textContent = '';
    $('dropzoneText').textContent = 'Click karo ya file yaha drag karo';
    $('uploadOverlay').style.display = 'flex';
  });
  $('cancelUploadBtn').addEventListener('click', () => $('uploadOverlay').style.display = 'none');
  $('uploadOverlay').addEventListener('click', (e) => { if(e.target.id === 'uploadOverlay') $('uploadOverlay').style.display = 'none'; });

  $('dropzone').addEventListener('click', () => $('fileInput').click());
  $('dropzone').addEventListener('dragover', (e) => { e.preventDefault(); $('dropzone').classList.add('drag'); });
  $('dropzone').addEventListener('dragleave', () => $('dropzone').classList.remove('drag'));
  $('dropzone').addEventListener('drop', (e) => {
    e.preventDefault();
    $('dropzone').classList.remove('drag');
    if(e.dataTransfer.files.length) handleFileChosen(e.dataTransfer.files[0]);
  });
  $('fileInput').addEventListener('change', (e) => {
    if(e.target.files.length) handleFileChosen(e.target.files[0]);
  });

  function handleFileChosen(file){
    selectedFileObj = file;
    $('chosenFileName').textContent = file.name;
    $('dropzoneText').textContent = 'File chuni gayi:';
    // Auto-fill title from filename (editable)
    $('titleInput').value = file.name;
  }

  function detectCategoryClient(mimeType){
    mimeType = mimeType || '';
    if(mimeType.indexOf('image') !== -1) return 'Image';
    if(mimeType.indexOf('pdf') !== -1) return 'PDF';
    if(mimeType.indexOf('word') !== -1 || mimeType.indexOf('document') !== -1 || mimeType.indexOf('text') !== -1 || mimeType.indexOf('sheet') !== -1 || mimeType.indexOf('presentation') !== -1) return 'Doc';
    return 'Other';
  }

  $('submitUploadBtn').addEventListener('click', async () => {
    if(!selectedFileObj){ showToast('Please choose a file first', true); return; }
    const title = $('titleInput').value.trim() || selectedFileObj.name;
    const desc = $('descInput').value.trim();
    const btn = $('submitUploadBtn'); const label = $('uploadBtnLabel');
    label.innerHTML = '<span class="spin"></span>';
    btn.disabled = true;
    try{
      const base64 = await fileToBase64(selectedFileObj);
      await apiCall('upload', {
        fileData: base64,
        mimeType: selectedFileObj.type || 'application/octet-stream',
        originalFileName: selectedFileObj.name,
        fileName: title,
        description: desc
      });
      showToast('File uploaded ✅');
      $('uploadOverlay').style.display = 'none';
      loadFiles();
    }catch(err){
      showToast('Upload failed: ' + err.message, true);
    }finally{
      label.textContent = 'Save';
      btn.disabled = false;
    }
  });

  // ============ EDIT MODAL ============
  let editingFile = null;
  function openEdit(f){
    editingFile = f;
    $('editTitleInput').value = f.FileName;
    $('editDescInput').value = f.Description || '';
    $('editOverlay').style.display = 'flex';
  }
  $('cancelEditBtn').addEventListener('click', () => $('editOverlay').style.display = 'none');
  $('editOverlay').addEventListener('click', (e) => { if(e.target.id === 'editOverlay') $('editOverlay').style.display = 'none'; });

  $('saveEditBtn').addEventListener('click', async () => {
    if(!editingFile) return;
    const newName = $('editTitleInput').value.trim();
    const newDesc = $('editDescInput').value.trim();
    if(!newName){ showToast('Title cannot be empty', true); return; }
    const btn = $('saveEditBtn'); const label = $('editBtnLabel');
    label.innerHTML = '<span class="spin"></span>';
    btn.disabled = true;
    try{
      await apiCall('update', { fileId: editingFile.FileID, fileName: newName, description: newDesc });
      showToast('Details updated ✅');
      $('editOverlay').style.display = 'none';
      loadFiles();
    }catch(err){
      showToast('Update failed: ' + err.message, true);
    }finally{
      label.textContent = 'Save Changes';
      btn.disabled = false;
    }
  });

  // ============ DELETE ============
  let deletingFile = null;
  function openDeleteConfirm(f){
    deletingFile = f;
    $('deleteFileName').textContent = '"' + f.FileName + '" will be permanently deleted.';
    $('deleteOverlay').style.display = 'flex';
  }
  $('cancelDeleteBtn').addEventListener('click', () => $('deleteOverlay').style.display = 'none');
  $('deleteOverlay').addEventListener('click', (e) => { if(e.target.id === 'deleteOverlay') $('deleteOverlay').style.display = 'none'; });

  $('confirmDeleteBtn').addEventListener('click', async () => {
    if(!deletingFile) return;
    const btn = $('confirmDeleteBtn'); const label = $('deleteBtnLabel');
    label.innerHTML = '<span class="spin"></span>';
    btn.disabled = true;
    try{
      await apiCall('delete', { fileId: deletingFile.FileID });
      showToast('File deleted');
      $('deleteOverlay').style.display = 'none';
      loadFiles();
    }catch(err){
      showToast('Delete failed: ' + err.message, true);
    }finally{
      label.textContent = 'Delete';
      btn.disabled = false;
    }
  });

  // ============ DOWNLOAD ============
  async function downloadFile(f){
    try{
      showToast('Preparing download...');
      const data = await apiCall('download', { fileId: f.FileID });
      const byteChars = atob(data.fileData);
      const byteNumbers = new Array(byteChars.length);
      for(let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: data.mimeType || 'application/octet-stream' });
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = data.fileName || f.FileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
    }catch(err){
      showToast('Download failed: ' + err.message, true);
    }
  }

  // ============ SHARE ============
  async function shareFileAction(f){
    try{
      showToast('Preparing...');

      // Try sharing the actual FILE itself (not a link) via the native share sheet.
      // Supported on most Android Chrome browsers and some iOS browsers.
      const data = await apiCall('download', { fileId: f.FileID });
      const byteChars = atob(data.fileData);
      const byteNumbers = new Array(byteChars.length);
      for(let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const fileObj = new File([byteArray], data.fileName || f.FileName, { type: data.mimeType || 'application/octet-stream' });

      if(navigator.canShare && navigator.canShare({ files: [fileObj] })){
        try{
          await navigator.share({ files: [fileObj], title: f.FileName });
          return;
        }catch(e){
          if(e.name === 'AbortError') return; // user cancelled the share sheet, do nothing
          // otherwise fall through to link-based sharing below
        }
      }

      // Fallback: device/browser can't share raw files -> share a view-only link instead
      const linkData = await apiCall('share', { fileId: f.FileID });
      const link = linkData.link;
      if(navigator.share){
        try{
          await navigator.share({ title: f.FileName, text: 'Check this out: ' + f.FileName, url: link });
          return;
        }catch(e){ /* cancelled */ }
      }
      await navigator.clipboard.writeText(link);
      showToast('This device can\'t share the file directly — link copied instead 📋');
    }catch(err){
      showToast('Share failed: ' + err.message, true);
    }
  }

  // ============ DETAIL / VIEW SCREEN ============
  function openDetail(f){
    currentDetailFile = f;
    mainScreen.style.display = 'none';
    detailScreen.style.display = 'flex';
    $('detailTitle').textContent = f.FileName;
    const frame = $('detailFrame');
    if(f.Category === 'Image' || f.Category === 'PDF' || f.Category === 'Doc'){
      frame.innerHTML = `<iframe src="https://drive.google.com/file/d/${f.FileID}/preview" allow="autoplay"></iframe>`;
    } else {
      frame.innerHTML = `<div class="detail-fallback">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <p>Preview isn't available for this file type.<br>Use the Download button to open it.</p>
      </div>`;
    }
  }
  $('backBtn').addEventListener('click', () => {
    detailScreen.style.display = 'none';
    mainScreen.style.display = 'flex';
    currentDetailFile = null;
  });
  $('detailDownloadBtn').addEventListener('click', () => { if(currentDetailFile) downloadFile(currentDetailFile); });
  $('detailShareBtn').addEventListener('click', () => { if(currentDetailFile) shareFileAction(currentDetailFile); });

})();
</script>
</body>
</html>
